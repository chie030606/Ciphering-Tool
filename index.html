<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher Tool with Solving Process</title>
<style>
  :root {
    --primary: #6366f1;
    --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
    --card-bg: rgba(255, 255, 255, 0.9);
    --text: #1e293b;
    --subtle: #64748b;
    --border: #e2e8f0;
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg-gradient);
    color: var(--text);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    width: 100%;
    max-width: 520px;
    padding: 28px;
    border-radius: 20px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    border: 1px solid rgba(255, 255, 255, 0.8);
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: #0f172a;
    text-align: center;
  }

  p.subtitle {
    margin: 0 0 20px 0;
    color: var(--subtle);
    font-size: 0.9rem;
    text-align: center;
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 6px;
    color: #334155;
  }

  .mode-toggle {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 0.9rem;
  }

  .mode-toggle label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    margin: 0;
    cursor: pointer;
  }

  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font: inherit;
    font-size: 0.95rem;
    background: #ffffff;
    box-sizing: border-box;
    transition: all 0.2s ease;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
  }

  textarea {
    resize: vertical;
    min-height: 60px;
  }

  .output-box {
    background: #f8fafc;
    color: #0f172a;
    font-family: monospace;
  }

  .steps-box {
    background: #1e293b;
    color: #38bdf8;
    font-family: monospace;
    font-size: 0.82rem;
    padding: 12px;
    border-radius: 10px;
    max-height: 180px;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.5;
  }

  .error {
    color: #ef4444;
    font-size: 0.85rem;
    margin-bottom: 12px;
    min-height: 1.2em;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="card">
    <h2>Cipher Tool</h2>
    <p class="subtitle">Real-time encryption & decryption tool</p>

    <div class="field">
      <label for="cipherType">Cipher Type</label>
      <select id="cipherType" onchange="updateUI()">
        <option value="monoalphabetic">Monoalphabetic Substitution Cipher</option>
        <option value="vigenere">Vigenère Cipher</option>
        <option value="polyalphabetic">Polyalphabetic Substitution Cipher</option>
      </select>
    </div>

    <div class="field">
      <label>Mode</label>
      <div class="mode-toggle">
        <label><input type="radio" name="mode" value="encrypt" checked onchange="updateUI()"> Encrypt</label>
        <label><input type="radio" name="mode" value="decrypt" onchange="updateUI()"> Decrypt</label>
      </div>
    </div>

    <div class="field">
      <label id="keyLabel" for="keyInput">Shift (Number)</label>
      <input type="text" id="keyInput" placeholder="e.g. 3" oninput="processCipher()">
    </div>

    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Type message here..." oninput="processCipher()"></textarea>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="field">
      <label id="outputLabel" for="output">Encrypted Result</label>
      <textarea id="output" class="output-box" readonly></textarea>
    </div>

    <div class="field" style="margin-bottom: 0;">
      <label>Step-by-Step Solving Process</label>
      <div id="stepsBox" class="steps-box">Enter text and a key to see the calculations...</div>
    </div>
  </div>

<script>
  function updateUI() {
    const type = document.getElementById("cipherType").value;
    const keyLabel = document.getElementById("keyLabel");
    const keyInput = document.getElementById("keyInput");

    if (type === "monoalphabetic") {
      keyLabel.textContent = "Shift (Number)";
      keyInput.placeholder = "e.g. 3";
    } else if (type === "vigenere") {
      keyLabel.textContent = "Keyword (Letters)";
      keyInput.placeholder = "e.g. KEY";
    } else if (type === "polyalphabetic") {
      keyLabel.textContent = "Initial Key (Number)";
      keyInput.placeholder = "e.g. 12";
    }
    processCipher();
  }

  function shiftCharWithSteps(char, shift) {
    const isUpper = char === char.toUpperCase();
    const base = isUpper ? 65 : 97;
    const origPos = char.charCodeAt(0) - base;
    const rawSum = origPos + shift;
    const newPos = (rawSum % 26 + 26) % 26;
    const newChar = String.fromCharCode(newPos + base);

    const stepText = `'${char}' (${origPos}) + key(${shift}) = ${rawSum} mod 26 = ${newPos} -> '${newChar}'`;

    return { char: newChar, step: stepText, origPos: origPos, newPos: newPos };
  }

  function processCipher() {
    const text = document.getElementById("message").value;
    const rawKey = document.getElementById("keyInput").value.trim();
    const type = document.getElementById("cipherType").value;
    const isDecrypt = document.querySelector('input[name="mode"]:checked').value === "decrypt";
    const errorBox = document.getElementById("errorBox");
    const output = document.getElementById("output");
    const outputLabel = document.getElementById("outputLabel");
    const stepsBox = document.getElementById("stepsBox");

    outputLabel.textContent = isDecrypt ? "Decrypted Result" : "Encrypted Result";
    errorBox.textContent = "";

    if (!text || !rawKey) {
      output.value = "";
      stepsBox.textContent = "Enter text and a key to see the calculations...";
      return;
    }

    try {
      let result = "";
      let steps = [];

      if (type === "monoalphabetic") {
        let shift = parseInt(rawKey);
        if (isNaN(shift)) throw new Error();
        if (isDecrypt) shift = -shift;

        for (let char of text) {
          if (/[a-zA-Z]/.test(char)) {
            const res = shiftCharWithSteps(char, shift);
            result += res.char;
            steps.push(res.step);
          } else {
            result += char;
            steps.push(`'${char}' (Skipped)`);
          }
        }
      } 
      else if (type === "vigenere") {
        const key = rawKey.toUpperCase();
        let keyIdx = 0;
        for (let char of text) {
          if (/[a-zA-Z]/.test(char)) {
            const keyChar = key[keyIdx % key.length];
            const keyShift = keyChar.charCodeAt(0) - 65;
            let shift = isDecrypt ? -keyShift : keyShift;

            const res = shiftCharWithSteps(char, shift);
            result += res.char;
            steps.push(`[Key: ${keyChar}] ` + res.step);
            keyIdx++;
          } else {
            result += char;
            steps.push(`'${char}' (Skipped)`);
          }
        }
      } 
      else if (type === "polyalphabetic") {
        let currentKey = parseInt(rawKey);
        if (isNaN(currentKey)) throw new Error();

        for (let char of text.toUpperCase()) {
          if (/[a-zA-Z]/.test(char)) {
            if (!isDecrypt) {
              // Encryption: key for step 1 is initial key, then subsequent keys are previous plaintext values
              const res = shiftCharWithSteps(char, currentKey);
              result += res.char;
              steps.push(`[Subkey: ${currentKey}] ` + res.step);
              currentKey = res.origPos; // set next subkey as current plaintext value
            } else {
              // Decryption: P = (C - key) mod 26
              const cVal = char.charCodeAt(0) - 65;
              const pVal = (cVal - currentKey % 26 + 26) % 26;
              const pChar = String.fromCharCode(pVal + 65);
              
              result += pChar;
              steps.push(`[Subkey: ${currentKey}] '${char}' (${cVal}) - key(${currentKey}) = ${cVal - currentKey} mod 26 = ${pVal} -> '${pChar}'`);
              currentKey = pVal; // set next subkey as recovered plaintext value
            }
          } else {
            result += char;
            steps.push(`'${char}' (Skipped)`);
          }
        }
      }

      output.value = result;
      stepsBox.textContent = steps.join("\n");
    } catch (e) {
      errorBox.textContent = "Invalid key format.";
      output.value = "";
      stepsBox.textContent = "Error calculating steps.";
    }
  }

  updateUI();
</script>
</body>
</html>
