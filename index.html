<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher Tool</title>
<style>
  :root {
    --primary: #6366f1;
    --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
    --card-bg: rgba(255, 255, 255, 0.9);
    --text: #1e293b;
    --subtle: #64748b;
    --border: #e2e8f0;
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg-gradient);
    color: var(--text);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    width: 100%;
    max-width: 440px;
    padding: 28px;
    border-radius: 20px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    border: 1px solid rgba(255, 255, 255, 0.8);
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: #0f172a;
    text-align: center;
  }

  p.subtitle {
    margin: 0 0 24px 0;
    color: var(--subtle);
    font-size: 0.9rem;
    text-align: center;
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 6px;
    color: #334155;
  }

  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font: inherit;
    font-size: 0.95rem;
    background: #ffffff;
    box-sizing: border-box;
    transition: all 0.2s ease;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
  }

  textarea {
    resize: vertical;
    min-height: 75px;
  }

  .output-box {
    background: #f8fafc;
    color: #0f172a;
    font-family: monospace;
  }

  .error {
    color: #ef4444;
    font-size: 0.85rem;
    margin-bottom: 12px;
    min-height: 1.2em;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="card">
    <h2>Cipher Tool</h2>
    <p class="subtitle">Real-time encryption tool</p>

    <div class="field">
      <label for="cipherType">Cipher Type</label>
      <select id="cipherType" onchange="updateUI()">
        <option value="caesar">Caesar Cipher</option>
        <option value="vigenere">Vigenère Cipher</option>
        <option value="polyalphabetic">Polyalphabetic Substitution Cipher</option>
      </select>
    </div>

    <div class="field">
      <label id="keyLabel" for="keyInput">Shift (Number)</label>
      <input type="text" id="keyInput" placeholder="e.g. 3" oninput="processCipher()">
    </div>

    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Type message here..." oninput="processCipher()"></textarea>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="field" style="margin-bottom: 0;">
      <label for="output">Encrypted Result</label>
      <textarea id="output" class="output-box" readonly></textarea>
    </div>
  </div>

<script>
  function updateUI() {
    const type = document.getElementById("cipherType").value;
    const keyLabel = document.getElementById("keyLabel");
    const keyInput = document.getElementById("keyInput");

    if (type === "caesar") {
      keyLabel.textContent = "Shift (Number)";
      keyInput.placeholder = "e.g. 3";
    } else if (type === "vigenere") {
      keyLabel.textContent = "Keyword (Letters)";
      keyInput.placeholder = "e.g. KEY";
    } else if (type === "polyalphabetic") {
      keyLabel.textContent = "Keys (Numbers separated by spaces)";
      keyInput.placeholder = "e.g. 1 4 7";
    }
    processCipher();
  }

  function shiftChar(char, shift) {
    const base = char === char.toUpperCase() ? 65 : 97;
    return String.fromCharCode((char.charCodeAt(0) - base + shift % 26 + 26) % 26 + base);
  }

  function processCipher() {
    const text = document.getElementById("message").value;
    const rawKey = document.getElementById("keyInput").value.trim();
    const type = document.getElementById("cipherType").value;
    const errorBox = document.getElementById("errorBox");
    const output = document.getElementById("output");

    errorBox.textContent = "";

    if (!text || !rawKey) {
      output.value = "";
      return;
    }

    try {
      let result = "";
      let keyIdx = 0;

      if (type === "caesar") {
        const shift = parseInt(rawKey);
        if (isNaN(shift)) throw new Error();
        for (let char of text) {
          result += /[a-zA-Z]/.test(char) ? shiftChar(char, shift) : char;
        }
      } 
      else if (type === "vigenere") {
        const key = rawKey.toUpperCase();
        for (let char of text) {
          if (/[a-zA-Z]/.test(char)) {
            let shift = key.charCodeAt(keyIdx % key.length) - 65;
            result += shiftChar(char, shift);
            keyIdx++;
          } else {
            result += char;
          }
        }
      } 
      else if (type === "polyalphabetic") {
        const keys = rawKey.split(/\s+/).map(Number);
        if (keys.some(isNaN)) throw new Error();
        for (let char of text.toUpperCase()) {
          if (/[a-zA-Z]/.test(char)) {
            let shift = keys[keyIdx % keys.length];
            result += shiftChar(char, shift);
            keyIdx++;
          }
        }
      }

      output.value = result;
    } catch (e) {
      errorBox.textContent = "Invalid key format.";
      output.value = "";
    }
  }
</script>
</body>
</html>
